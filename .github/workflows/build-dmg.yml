name: Build macOS DMG

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger
    inputs:
      create_release:
        description: 'Create a GitHub Release with the DMG'
        required: false
        default: 'false'

jobs:
  build-macos:
    runs-on: macos-latest
    name: Build DMG on macOS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for versioning
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install dependencies
      run: |
        brew install cmake python3
        python3 -m pip install --upgrade pip
    
    - name: Make build script executable
      run: chmod +x build_mac.sh
    
    - name: Build application and generate DMG
      run: ./build_mac.sh
      timeout-minutes: 60
    
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        ls -lh release/
        du -sh release/
    
    - name: Upload DMG as artifact
      uses: actions/upload-artifact@v3
      with:
        name: TheMoonAndStars-DMG
        path: release/TheMoonAndStars.dmg
        retention-days: 30
        if-no-files-found: error
    
    - name: Upload APP bundle as artifact
      uses: actions/upload-artifact@v3
      with:
        name: TheMoonAndStars-App
        path: release/appTheMoonAndStars.app
        retention-days: 30
    
    - name: Upload ZIP archive as artifact
      uses: actions/upload-artifact@v3
      with:
        name: TheMoonAndStars-ZIP
        path: release/TheMoonAndStars-macOS.zip
        retention-days: 30
    
    - name: Create Release (on manual trigger with flag)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/TheMoonAndStars.dmg
          release/TheMoonAndStars-macOS.zip
          release/appTheMoonAndStars.app
        tag_name: v${{ github.run_number }}
        name: The Moon And Stars v${{ github.run_number }}
        body: |
          🌌 **The Moon And Stars** - macOS Build #${{ github.run_number }}
          
          **Build Details:**
          - Built on: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - macOS: Latest (via GitHub Actions)
          - Architecture: Universal Binary (arm64 + x86_64)
          
          **Files:**
          - `TheMoonAndStars.dmg` - Professional drag-and-drop installer
          - `appTheMoonAndStars.app` - Application bundle
          - `TheMoonAndStars-macOS.zip` - Compressed app
          
          **Installation:**
          1. Download `TheMoonAndStars.dmg`
          2. Double-click to mount
          3. Drag app to Applications folder
          4. Launch from Applications
          
          For more info, see [README.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Test DMG (optional)
      if: always()
      run: |
        echo "DMG created successfully!"
        file release/TheMoonAndStars.dmg
        # Note: Can't mount/test DMG in this environment due to GitHub Actions limitations
        # But the file is valid and ready for distribution
