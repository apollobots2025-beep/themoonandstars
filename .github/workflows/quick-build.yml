name: Quick DMG Build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-13  # Specific older macOS for better compatibility
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup build environment
      run: |
        brew install cmake python3
        python3 -m pip install --upgrade pip
        echo "✅ Build environment ready"
    
    - name: Build DMG
      run: |
        chmod +x build_mac.sh
        ./build_mac.sh 2>&1 | tee build.log
    
    - name: Generate build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifacts Generated:**" >> $GITHUB_STEP_SUMMARY
        ls -lh release/ | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[📥 Download from build artifacts](#artifacts)" >> $GITHUB_STEP_SUMMARY
    
    - name: Upload all artifacts
      uses: actions/upload-artifact@v3
      with:
        name: macos-build
        path: release/
        retention-days: 30
    
    - name: Create Release
      if: inputs.upload_release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        tag_name: v${{ github.run_number }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
