name: Build Windows .exe (MSYS2/MinGW)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Update system and install dependencies
        shell: msys2 {0}
        run: |
          set -e
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-qt6

      - name: Configure and build (Release)
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p build
          cd build
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64 ..
          cmake --build . --config Release -j

      - name: List build outputs
        shell: msys2 {0}
        run: |
          echo "Build tree:"
          ls -la build || true
          echo "Find exe(s):"
          find . -maxdepth 3 -type f -name "*.exe" -print || true

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheMoonAndStars-windows-exe
          path: |
            build/*.exe
            build/**/Release/*.exe
